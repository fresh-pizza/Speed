<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Shop Speed Check</title>
<style>
/* layout: one narrow column; a results table per round, a summary on top */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --ink:#1A211E; --muted:#5B6862; --line:#D3DAD4;
  --accent:#8A5A00; --good:#2E7D4F; --warn:#A86A00; --bad:#B3261E;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1311; --surface:#1A211E; --ink:#EEF3EF; --muted:#A9B7AF; --line:#2C3732;
  --accent:#F0AC1B; --good:#6FCF97; --warn:#F2C14E; --bad:#FF8A80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1311; --surface:#1A211E; --ink:#EEF3EF; --muted:#A9B7AF; --line:#2C3732;
  --accent:#F0AC1B; --good:#6FCF97; --warn:#F2C14E; --bad:#FF8A80; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:22px;letter-spacing:-.01em;text-wrap:balance}
.lead{margin:0;color:var(--muted);font-size:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-weight:600;border-radius:12px;padding:12px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button.go{background:var(--ink);color:var(--bg);border-color:var(--ink);flex:1}
button:disabled{opacity:.5}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{font-size:14px;color:var(--muted);min-height:1.4em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.card h2{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th,td{text-align:left;padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:12px;border-top:0}
td.n{text-align:right;font-family:var(--mono);white-space:nowrap}
th.n{text-align:right}
td small{display:block;color:var(--muted);font-size:12px}
.ok{color:var(--good)} .slow{color:var(--warn)} .bad{color:var(--bad)}
.legend{font-size:13px;color:var(--muted);margin:0}
textarea{width:100%;box-sizing:border-box;min-height:140px;font-family:var(--mono);font-size:12px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px}
</style>
</head>
<body style="margin:0">

<div class="wrap">
  <h1>Shop speed check</h1>
  <p class="lead">Times each thing the shop downloads when it opens, three rounds in a row. Round 1 includes setting up the connection. Nothing is saved or sent anywhere.</p>
  <div class="bar">
    <button class="go" id="run" type="button">Start</button>
    <button id="copy" type="button" disabled>Copy results</button>
  </div>
  <div class="status" id="status" role="status"></div>
  <p class="legend"><span class="ok">green</span> under 0.5 s · <span class="slow">amber</span> 0.5 to 2 s · <span class="bad">red</span> over 2 s or failed</p>
  <div id="out" style="display:flex;flex-direction:column;gap:12px"></div>
  <textarea id="txt" hidden readonly aria-label="Results as text"></textarea>
</div>

<script>
(function () {
  const SUPA = 'https://qgoyengzjgsxpqkhhyjm.supabase.co';
  const KEY = 'sb_publishable_guwA3lmtAw61a5ks898qoQ_i07f7y3q';
  const SITE = 'https://fresh-pizza.github.io/orderdesk/shop/';
  const H = { apikey: KEY, Authorization: 'Bearer ' + KEY };
  const ROUNDS = 3, LIMIT = 20000;
  const $ = s => document.querySelector(s);
  let photoPath = '', lines = [];

  const fmt = ms => ms == null ? '—' : (ms < 1000 ? Math.round(ms) + ' ms' : (ms / 1000).toFixed(2) + ' s');
  const kb = b => b == null ? '' : (b < 1024 ? b + ' B' : (b / 1024).toFixed(1) + ' KB');
  const cls = (ms, ok) => !ok ? 'bad' : ms < 500 ? 'ok' : ms < 2000 ? 'slow' : 'bad';
  const bust = u => u + (u.includes('?') ? '&' : '?') + 't=' + Date.now() + Math.random().toString(36).slice(2, 6);

  // one download, timed from asking to having every byte
  async function timed(url, headers) {
    const u = bust(url), ctl = new AbortController(), stop = setTimeout(() => ctl.abort(), LIMIT);
    const t0 = performance.now();
    try {
      const r = await fetch(u, { headers: headers || {}, cache: 'no-store', signal: ctl.signal });
      const buf = await r.arrayBuffer();
      const ms = performance.now() - t0;
      const e = performance.getEntriesByName(u).pop();
      const wait = e && e.responseStart > 0 && e.requestStart > 0 ? e.responseStart - e.requestStart : null;
      const setup = e && e.connectEnd > 0 && e.domainLookupStart > 0 ? e.connectEnd - e.domainLookupStart : null;
      return { ms, ok: r.ok, bytes: buf.byteLength, code: r.status, buf, wait, setup };
    } catch (x) {
      return { ms: performance.now() - t0, ok: false, err: x && x.name === 'AbortError' ? 'no answer in 20 s' : 'failed: ' + ((x && x.message) || x) };
    } finally { clearTimeout(stop); }
  }

  const tests = [
    { name: 'Shop page file', where: 'GitHub', run: () => timed(SITE + 'index.html') },
    { name: 'Version check', where: 'GitHub', run: () => timed(SITE + 'version.json') },
    { name: 'Server ping (tiny)', where: 'Supabase', run: () => timed(SUPA + '/rest/v1/settings?select=id&limit=1', H) },
    { name: 'Settings', where: 'Supabase', run: () => timed(SUPA + '/rest/v1/settings?select=*&id=eq.business', H) },
    { name: 'Menu', where: 'Supabase', run: async () => {
        const r = await timed(SUPA + '/rest/v1/menu?select=*&deleted=eq.false', H);
        if (r.ok) { try { const rows = JSON.parse(new TextDecoder().decode(r.buf)); r.note = rows.length + ' dishes'; const p = rows.find(m => m.photo); if (p) photoPath = p.photo; } catch (_) { /* not JSON */ } }
        return r; } },
    { name: 'Settings + menu together', where: 'Supabase, like the shop', run: async () => {
        const t0 = performance.now();
        const [a, b] = await Promise.all([timed(SUPA + '/rest/v1/settings?select=*&id=eq.business', H), timed(SUPA + '/rest/v1/menu?select=*&deleted=eq.false', H)]);
        return { ms: performance.now() - t0, ok: a.ok && b.ok, bytes: (a.bytes || 0) + (b.bytes || 0), err: a.err || b.err }; } },
    { name: 'One dish photo', where: 'Supabase storage', run: () => photoPath
        ? timed(SUPA + '/storage/v1/object/public/photos/' + photoPath.split('/').map(encodeURIComponent).join('/'))
        : Promise.resolve({ ms: null, ok: false, err: 'no photo found in the menu' }) },
  ];

  function table(round, rows) {
    const card = document.createElement('div'); card.className = 'card';
    const h = document.createElement('h2'); h.textContent = 'Round ' + round + (round === 1 ? ' · fresh connection' : ''); card.append(h);
    const box = document.createElement('div'); box.className = 'tbl';
    const t = document.createElement('table');
    t.innerHTML = '<thead><tr><th>What</th><th class="n">Time</th><th class="n">Size</th></tr></thead>';
    const tb = document.createElement('tbody');
    for (const [test, r] of rows) {
      const tr = document.createElement('tr');
      const a = document.createElement('td'); a.textContent = test.name;
      const sm = document.createElement('small');
      const extra = [test.where];
      if (r.note) extra.push(r.note);
      if (r.setup != null && r.setup > 1) extra.push('connect ' + fmt(r.setup));
      if (r.wait != null) extra.push('server ' + fmt(r.wait));
      if (r.err) extra.push(r.err); else if (!r.ok && r.code) extra.push('error ' + r.code);
      sm.textContent = extra.join(' · '); a.append(sm);
      const b = document.createElement('td'); b.className = 'n ' + cls(r.ms, r.ok); b.textContent = fmt(r.ms);
      const c = document.createElement('td'); c.className = 'n'; c.textContent = kb(r.bytes);
      tr.append(a, b, c); tb.append(tr);
    }
    t.append(tb); box.append(t); card.append(box); $('#out').append(card);
  }

  async function start() {
    $('#run').disabled = true; $('#copy').disabled = true; $('#out').replaceChildren(); $('#txt').hidden = true;
    photoPath = ''; lines = ['Shop speed check ' + new Date().toLocaleString()];
    for (let round = 1; round <= ROUNDS; round++) {
      const rows = [];
      for (const test of tests) {
        $('#status').textContent = 'Round ' + round + ' of ' + ROUNDS + ': ' + test.name + '…';
        const r = await test.run(); rows.push([test, r]);
        lines.push('R' + round + ' ' + test.name + ': ' + (r.ok ? fmt(r.ms) : 'FAIL ' + (r.err || r.code || '') + ' after ' + fmt(r.ms)) + (r.bytes ? ' ' + kb(r.bytes) : '') + (r.wait != null ? ' server ' + fmt(r.wait) : '') + (r.note ? ' (' + r.note + ')' : ''));
      }
      table(round, rows);
      if (round < ROUNDS) await new Promise(res => setTimeout(res, 800));
    }
    $('#status').textContent = 'Done. Take a screenshot, or copy the results and send them.';
    $('#run').disabled = false; $('#run').textContent = 'Run again'; $('#copy').disabled = false;
  }

  $('#run').addEventListener('click', start);
  $('#copy').addEventListener('click', () => {
    const text = lines.join('\n'), box = $('#txt');
    box.value = text;
    const fallback = () => { box.hidden = false; box.focus(); box.select(); $('#status').textContent = 'Press and hold the text below, then copy.'; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => { $('#status').textContent = 'Copied.'; }, fallback);
    else fallback();
  });
})();
</script>
</body>
</html>
